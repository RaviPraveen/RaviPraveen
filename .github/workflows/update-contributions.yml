name: Refresh contribution calendar
on:
  workflow_dispatch:
  schedule:
    - cron: '24 2 * * *'
  push:
    paths:
      - '.github/workflows/update-contributions.yml'
      - 'scripts/contribution_generator.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render chart from GitHub contribution data
        run: python scripts/contribution_generator.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit chart if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh rolling GitHub contributions chart"
            git push
          fi
